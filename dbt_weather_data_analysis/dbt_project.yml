
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_weather_data_analysis'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_weather_data_analysis'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  km_per_deg_lat: 111.32   # config.KM_PER_DEG_LAT
  radiation_sunny_threshold: 300
  radiation_cloudy_threshold: 150
  visibility_alert_km: 5.0

  # KPI: wind
  air_density_kg_m3: 1.225
  wind_cutin_speed_ms: 3.0
  wind_rated_speed_ms: 12.0

  # KPI: solar (source: Ndiaye et al. 2025, Solar Energy Advances 5, 100101)
  solar_reference_irradiance_w_m2: 1000    # G_STC
  pv_nominal_power_kw: 1                    # Pp, per-panel/unit basis
  pv_noct_c: 45                             # NOCT, poly/mono-Si (Sun et al. 2020)
  pv_gamma_per_c: -0.0035                   # temp coefficient, poly-Si (Fuentes et al. 2007)
  pv_tstc_c: 25                             # T_STC
  
   # Harmattan / dust
  harmattan_dust_light: 50      # µg/m³ — WHO-adjacent light dust threshold
  harmattan_dust_moderate: 150
  harmattan_dust_severe: 300

  # Preventive maintenance window
  maintenance_max_wind_kmh: 20
  maintenance_max_pm10: 50
  maintenance_min_window_hours: 3

  peak_hour_start: 11
  peak_hour_end: 15
  grid_risk_threshold_pct: 40          # X% — adjust to your ops team's real risk tolerance
  solar_coverage_threshold_w_m2: 200   # minimum irradiance counted as "producing"
  
  # Grid stability: independent clear-sky reference (NOT derived from observed data)
  clear_sky_peak_radiation_w_m2: 900   # realistic clear-sky peak for Senegal, per Ndiaye et al. 2025 simulations
  grid_risk_persistence_hours: 2       # consecutive risky hours needed before recommending generator activation

seeds:
  dbt_weather_data_analysis:
    +schema: seeds
# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  dbt_weather_data_analysis:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +materialized: view
    marts:
      +materialized: table
