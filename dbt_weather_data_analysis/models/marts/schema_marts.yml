models:
  - name: kpi_potential
    description: >
      Solar/wind generation potential KPI. Solar formula (performance ratio,
      NOCT-based cell temperature) sourced from Ndiaye et al. 2025 (Solar Energy
      Advances), validated against observed production at Ten Merina plant only
      (2018-2021). Temperature coefficient (gamma) and NOCT are generic
      poly-crystalline Si properties, not Ten-Merina-specific, but the paper's
      own validation is geographically limited to one site — treat solar_output_kwh_per_kw
      as a physically-grounded estimate, not a site-validated one, for
      arrondissements outside Thiès region.
    columns:
      - name: solar_score
